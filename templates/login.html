{% extends "base.html" %}

{% block title %}Sign In — AI Job Agent{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card p-4 p-sm-5 border">
        <div class="text-center mb-4">
            <div class="rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 54px; height: 54px; background: rgba(59, 130, 246, 0.12);">
                <i class="bi bi-shield-lock-fill fs-3 text-primary"></i>
            </div>
            <h4 class="fw-bold mb-1 text-body">Welcome Back</h4>
            <p class="text-secondary small mb-0">Sign in to your AI Job Agent account</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-body">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus autocomplete="email">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold text-body">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" name="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="btn password-toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)" title="Show / Hide Password" tabindex="-1">
                        <i class="bi bi-eye text-muted"></i>
                    </button>
                </div>
            </div>

            <div class="d-flex align-items-center justify-content-between mb-4">
                <div class="form-check">
                    <input type="checkbox" name="remember" class="form-check-input" id="rememberMe">
                    <label class="form-check-label small text-secondary" for="rememberMe">Remember me</label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <p class="text-secondary small mb-2">
                Don't have an account?
                <a href="{{ url_for('auth.register') }}" class="fw-semibold text-primary text-decoration-none">Create account</a>
            </p>
            <a href="{{ url_for('jobs.list_jobs') }}" class="small text-secondary text-decoration-none d-inline-flex align-items-center gap-1">
                <i class="bi bi-briefcase"></i> Browse verified jobs without signing in
            </a>
        </div>
    </div>
</div>

<script>
function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        if (icon) {
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        }
    } else {
        input.type = 'password';
        if (icon) {
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    }
}
</script>
{% endblock %}
