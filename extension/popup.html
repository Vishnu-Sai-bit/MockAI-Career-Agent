<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Job Agent Auto-Fill</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      color: #1e293b;
      background: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
    }
    .header h4 {
      margin: 0;
      font-size: 15px;
      color: #0f172a;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 9999px;
      background: #dbeafe;
      color: #1d4ed8;
      font-weight: 600;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .card-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .card-row:last-child {
      margin-bottom: 0;
    }
    .card-label {
      color: #64748b;
    }
    .card-val {
      font-weight: 600;
      color: #0f172a;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: #f1f5f9;
    }
    .status {
      margin-top: 8px;
      font-size: 11px;
      text-align: center;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">AI Companion</span>
    <h4>AI Job Agent Auto-Fill</h4>
  </div>

  <div class="card">
    <div class="card-row">
      <span class="card-label">Active Candidate:</span>
      <span class="card-val" id="cand-name">Beere Vishnu Sai</span>
    </div>
    <div class="card-row">
      <span class="card-label">Email:</span>
      <span class="card-val" id="cand-email">beerevishnusai...</span>
    </div>
    <div class="card-row">
      <span class="card-label">ATS Ready Score:</span>
      <span class="card-val" style="color: #16a34a;">85.5% (Optimal)</span>
    </div>
  </div>

  <button class="btn" id="autofill-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
    1-Click Auto-Fill Application
  </button>

  <button class="btn btn-secondary" id="dashboard-btn">
    Open AI Job Agent
  </button>

  <div class="status" id="status-text">Ready to auto-fill official forms</div>

  <script src="popup.js"></script>
</body>
</html>
